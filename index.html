<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub-Bot WhatsApp</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1e293b; max-width: 400px; margin: 40px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #22c55e; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; }
        input, select { background: #334155; color: #fff; }
        button { background: #22c55e; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #16a34a; }
        .code-box { font-size: 24px; font-weight: bold; letter-spacing: 4px; color: #38bdf8; margin-top: 15px; background: #0f172a; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Connecter votre Sub-Bot</h2>
    <label>Serveur actif :</label>
    <select id="server">
        <option value="https://subbot-backend.onrender.com">Serveur Principal (Render)</option>
    </select>

    <label>Numéro de téléphone (avec indicatif) :</label>
    <input type="text" id="phone" placeholder="Ex: 50912345678">

    <button onclick="getPairingCode()">Obtenir le code</button>

    <div id="result"></div>
</div>

<script>
    async function getPairingCode() {
        const phone = document.getElementById('phone').value;
        const server = document.getElementById('server').value;
        const resultDiv = document.getElementById('result');

        if (!phone) {
            alert("Veuillez entrer votre numéro de téléphone");
            return;
        }

        resultDiv.innerHTML = "<p>Génération du code...</p>";

        try {
            const res = await fetch(`${server}/pair?code=${phone}`);
            const data = await res.json();

            if (data.code) {
                resultDiv.innerHTML = `
                    <p>Entrez ce code dans WhatsApp :</p>
                    <div class="code-box">${data.code}</div>
                `;
            } else if (data.message) {
                resultDiv.innerHTML = `<p style="color: #22c55e;">${data.message}</p>`;
            } else {
                resultDiv.innerHTML = `<p style="color: #ef4444;">Erreur lors de la génération.</p>`;
            }
        } catch (err) {
            resultDiv.innerHTML = `<p style="color: #ef4444;">Impossible de contacter le serveur.</p>`;
        }
    }
</script>

</body>
</html>
