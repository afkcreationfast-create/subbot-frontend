<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFK SubBot</title>
  <style>
    body { background: #0f111a; color: #fff; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #16192b; padding: 25px; border-radius: 16px; width: 90%; max-width: 380px; text-align: center; border: 1px solid #2a2e45; }
    input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #0f111a; color: #fff; text-align: center; font-size: 1rem; box-sizing: border-box; }
    button { width: 100%; padding: 14px; margin-top: 8px; border: none; border-radius: 10px; background: #8a2be2; color: #fff; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
    button:active { opacity: 0.8; }
    .btn-qr { background: #25d366; }
    .box { margin-top: 20px; padding: 15px; background: #090a10; border-radius: 10px; border: 1px dashed #8a2be2; min-height: 60px; display: flex; align-items: center; justify-content: center; }
    #code { font-size: 1.6rem; font-weight: bold; color: #00ffff; letter-spacing: 2px; }
    #qr { max-width: 180px; display: none; margin: 0 auto; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>AFK SubBot</h2>
    <p style="font-size: 0.85rem; color: #aaa;">Entrez votre numéro avec l'indicatif (ex: 50931234567)</p>

    <input type="tel" id="phone" placeholder="Numéro WhatsApp">

    <button onclick="req('pair')">Obtenir le Code d'Appairage</button>
    <button class="btn-qr" onclick="req('qr')">Générer un QR Code</button>

    <div class="box">
      <div id="code">Prêt...</div>
      <img id="qr" alt="QR Code">
    </div>
  </div>

  <script>
    const API = "https://subbot-backend.onrender.com";

    async function req(type) {
      const num = document.getElementById('phone').value;
      const codeEl = document.getElementById('code');
      const qrEl = document.getElementById('qr');

      if (!num) return alert('Veuillez entrer votre numéro');

      qrEl.style.display = 'none';
      codeEl.style.display = 'block';
      codeEl.innerText = "Génération...";

      try {
        const res = await fetch(`${API}/${type}?number=${num}`);
        const data = await res.json();

        if (type === 'pair') {
          codeEl.innerText = data.code || data.error || "Erreur";
        } else if (data.qr) {
          codeEl.style.display = 'none';
          qrEl.src = data.qr;
          qrEl.style.display = 'block';
        } else {
          codeEl.innerText = data.error || "Erreur QR";
        }
      } catch (e) {
        codeEl.innerText = "Erreur de connexion";
      }
    }
  </script>
</body>
</html>
