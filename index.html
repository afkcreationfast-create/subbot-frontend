<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFK SubBot - Connexion</title>
  <style>
    body {
      background-color: #0f111a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #16192b;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0f111a;
      color: #fff;
      box-sizing: border-box;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: #8a2be2;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #7a1bd2; }
    .btn-qr { background: #25d366; }
    .btn-qr:hover { background: #1da851; }
    .output-box {
      margin-top: 20px;
      padding: 15px;
      background: #090a10;
      border-radius: 8px;
      border: 1px dashed #8a2be2;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #qrImage { max-width: 200px; display: none; margin: 10px auto; }
    #codeDisplay { font-size: 1.5rem; font-weight: bold; color: #00ffff; }
  </style>
</head>
<body>

  <div class="card">
    <h2>AFK SubBot</h2>
    <p>Choisissez votre mode de connexion :</p>

    <input type="text" id="phone" placeholder="Ex: 50931234567">

    <button onclick="getCode()">Obtenir le Code d'Appairage</button>
    <button class="btn-qr" onclick="getQR()">Générer un QR Code</button>

    <div class="output-box">
      <div id="codeDisplay">Attente d'action...</div>
      <img id="qrImage" alt="QR Code">
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://subbot-backend.onrender.com";

    async function getCode() {
      const num = document.getElementById('phone').value;
      const display = document.getElementById('codeDisplay');
      const img = document.getElementById('qrImage');

      if (!num) return alert('Entrez votre numéro');

      img.style.display = 'none';
      display.style.display = 'block';
      display.innerText = "Chargement...";

      try {
        const res = await fetch(`${BACKEND_URL}/pair?number=${num}`);
        const data = await res.json();
        display.innerText = data.code || data.error;
      } catch (e) {
        display.innerText = "Erreur de connexion";
      }
    }

    async function getQR() {
      const num = document.getElementById('phone').value || '12345';
      const display = document.getElementById('codeDisplay');
      const img = document.getElementById('qrImage');

      display.style.display = 'block';
      display.innerText = "Génération du QR Code...";
      img.style.display = 'none';

      try {
        const res = await fetch(`${BACKEND_URL}/qr?number=${num}`);
        const data = await res.json();

        if (data.qr) {
          display.style.display = 'none';
          img.src = data.qr;
          img.style.display = 'block';
        } else {
          display.innerText = data.error || "Erreur QR";
        }
      } catch (e) {
        display.innerText = "Erreur de connexion";
      }
    }
  </script>
</body>
</html>
