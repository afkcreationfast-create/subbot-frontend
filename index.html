<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFK SubBot - Code d'Appairage</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 27, 34, 0.85);
      --primary: #9d4edd;
      --accent: #00ffff;
      --text: #ffffff;
      --text-dim: #a3b1c6;
      --danger: #ff4d4d;
      --success: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 1px solid rgba(157, 78, 221, 0.3);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(157, 78, 221, 0.2);
      backdrop-filter: blur(10px);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
    }

    h1 {
      font-size: 2rem;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .section {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-dim);
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 15px;
      border-radius: 8px;
      border: 1px solid rgba(157, 78, 221, 0.4);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 1.1rem;
      outline: none;
      transition: border 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), #7b2cbf);
      color: var(--text);
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    button:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px rgba(157, 78, 221, 0.5);
    }

    .code-box {
      margin-top: 20px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.5);
      border: 2px dashed var(--accent);
      border-radius: 10px;
      text-align: center;
      display: none;
    }

    .code-box h3 {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .pairing-code {
      font-family: monospace;
      font-size: 2.2rem;
      letter-spacing: 6px;
      color: var(--accent);
      font-weight: bold;
    }

    .console-log {
      background: #050811;
      border-radius: 8px;
      padding: 12px;
      height: 100px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.8rem;
      color: var(--accent);
      margin-top: 20px;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      color: var(--text-dim);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AFK SubBot</h1>
      <p class="subtitle">Connexion WhatsApp par Code d'Appairage</p>
    </header>

    <div class="section">
      <label for="phoneNumber">Numéro WhatsApp (avec indicatif pays) :</label>
      <input type="text" id="phoneNumber" placeholder="Exemple: 50931234567">
    </div>

    <button onclick="getPairingCode()">Obtenir le Code d'Appairage</button>

    <div class="code-box" id="codeBox">
      <h3>VOTRE CODE DE CONNEXION :</h3>
      <div class="pairing-code" id="pairingCode">--------</div>
    </div>

    <div class="console-log" id="consoleLog">
      > Entrez votre numéro puis cliquez sur le bouton.<br>
    </div>

    <footer>
      &copy; AFK Création et Marketing — Tous droits réservés.
    </footer>
  </div>

  <script>
    const BACKEND_URL = "https://subbot-backend.onrender.com";

    function logMessage(msg) {
      const consoleLog = document.getElementById('consoleLog');
      const time = new Date().toLocaleTimeString();
      consoleLog.innerHTML += `[${time}] ${msg}<br>`;
      consoleLog.scrollTop = consoleLog.scrollHeight;
    }

    async function getPairingCode() {
      const rawNumber = document.getElementById('phoneNumber').value;
      const phoneInput = rawNumber.replace(/[^0-9]/g, '');
      const codeBox = document.getElementById('codeBox');
      const pairingCodeDisplay = document.getElementById('pairingCode');

      if (!phoneInput || phoneInput.length < 8) {
        alert("Veuillez saisir un numéro de téléphone valide avec l'indicatif (ex: 50931234567).");
        return;
      }

      logMessage(`Demande de code pour : +${phoneInput}...`);
      
      try {
        const res = await fetch(`${BACKEND_URL}/pair?number=${phoneInput}`);
        const data = await res.json();

        if (data.code) {
          pairingCodeDisplay.innerText = data.code;
          codeBox.style.display = 'block';
          logMessage("Code généré ! Allez sur WhatsApp > Appareils connectés > Associer avec un code.");
        } else {
          logMessage("Erreur : Impossible d'obtenir le code.");
        }
      } catch (err) {
        logMessage("Erreur réseau : Le serveur Render n'est pas encore prêt.");
      }
    }
  </script>
</body>
</html>
