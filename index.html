<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFK SubBot - Control Panel</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 27, 34, 0.8);
      --primary: #9d4edd;
      --accent: #00ffff;
      --text: #ffffff;
      --text-dim: #a3b1c6;
      --danger: #ff4d4d;
      --success: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border: 1px solid rgba(157, 78, 221, 0.3);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(157, 78, 221, 0.2);
      backdrop-filter: blur(10px);
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    .status-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 25px;
      border: 1px solid rgba(0, 255, 255, 0.2);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    .dot.online {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .section {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-dim);
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid rgba(157, 78, 221, 0.4);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    .btn-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 150px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #7b2cbf);
      color: var(--text);
    }

    .btn-primary:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px rgba(157, 78, 221, 0.5);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .btn-secondary:hover {
      background: rgba(0, 255, 255, 0.1);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    }

    .console-log {
      background: #050811;
      border-radius: 8px;
      padding: 15px;
      height: 180px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: var(--accent);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    footer {
      text-align: center;
      margin-top: 25px;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AFK SubBot Panel</h1>
      <p class="subtitle">Gestion et contrôle en direct de votre bot WhatsApp</p>
    </header>

    <div class="status-card">
      <span>État du Serveur (Render) :</span>
      <div class="status-indicator">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Vérification...</span>
      </div>
    </div>

    <div class="section">
      <label for="sessionId">Session ID :</label>
      <input type="text" id="sessionId" placeholder="Entrez votre SESSION_ID ici...">
    </div>

    <div class="section btn-group">
      <button class="btn-primary" onclick="saveConfig()">Enregistrer & Démarrer</button>
      <button class="btn-secondary" onclick="checkStatus()">Actualiser Statut</button>
    </div>

    <div class="section">
      <label>Logs du système :</label>
      <div class="console-log" id="consoleLog">
        > Patienter... Connexion au panneau d'administration.<br>
      </div>
    </div>

    <footer>
      &copy; AFK Création et Marketing — Tous droits réservés.
    </footer>
  </div>

  <script>
    // Remplacez par votre URL Render exacte une fois le backend créé
    const BACKEND_URL = "https://subbot-backend.onrender.com";

    function logMessage(msg) {
      const consoleLog = document.getElementById('consoleLog');
      const time = new Date().toLocaleTimeString();
      consoleLog.innerHTML += `[${time}] ${msg}<br>`;
      consoleLog.scrollTop = consoleLog.scrollHeight;
    }

    async function checkStatus() {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      
      try {
        logMessage("Vérification de la connexion au serveur backend...");
        const res = await fetch(`${BACKEND_URL}/`);
        if (res.ok) {
          dot.classList.add('online');
          text.innerText = "En ligne";
          logMessage("Serveur Render en ligne et opérationnel.");
        } else {
          throw new Error("Réponse serveur non valide");
        }
      } catch (err) {
        dot.classList.remove('online');
        text.innerText = "Hors ligne / En veille";
        logMessage("Impossible de joindre le backend Render (Le service est peut-être en veille).");
      }
    }

    async function saveConfig() {
      const sessionId = document.getElementById('sessionId').value.trim();
      if (!sessionId) {
        alert("Veuillez saisir un SESSION_ID valide.");
        return;
      }

      logMessage("Envoi de la configuration au backend...");
      
      try {
        const res = await fetch(`${BACKEND_URL}/config`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ SESSION_ID: sessionId })
        });

        if (res.ok) {
          logMessage("Configuration mise à jour avec succès !");
        } else {
          logMessage("Erreur lors de la mise à jour de la configuration.");
        }
      } catch (err) {
        logMessage("Erreur réseau : " + err.message);
      }
    }

    // Vérifier le statut au chargement de la page
    window.onload = checkStatus;
  </script>
</body>
</html>
